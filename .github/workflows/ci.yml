name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los tipos se generan del esquema: si alguien edita el esquema sin regenerarlos,
      # el diff no queda limpio y el trabajo falla.
      - run: npm run gen:types
      - run: git diff --exit-code -- apps/web/src/types apps/web/src/generated
      - run: npm run typecheck
      - run: npm test # regla de abstención, coherencia y validación de reportes contra el esquema

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libsndfile1
      - run: pip install -r apps/api/requirements.txt -r apps/api/requirements-llm.txt
      # Vuelve a ejecutar cada prueba de calibración y la compara con results.json;
      # valida contra el esquema un reporte generado de audio real.
      - run: python -m pytest -q
        working-directory: apps/api
